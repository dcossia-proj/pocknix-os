# Full-stats HUD for the bottom screen (pocknix-hud-bottom.service), toggled
# by a tap of the AYN button. Static: Steam never rewrites this file.
#
# background_alpha=1 (fully opaque) - armada's version of this file shipped
# 0.8, which read as translucent/see-through on the bottom panel; the AYN
# button already fully hides/shows the HUD by stopping/starting the unit, so
# there's no need for the HUD itself to also be partially transparent.
# Actual fullscreen coverage of the panel is handled by pocknix-hud-bottom's
# dynamic kwinrulesrc write (position+size+fullscreen forced to the live
# secondary-output geometry), not by anything in this file.
table_columns=3
font_size=32
background_alpha=1
position=top-left

# Frame pacing and presentation
fps
frametime
frame_timing
frame_timing_detailed
fps_metrics=avg,0.01
refresh_rate
show_fps_limit
present_mode
resolution

# CPU
cpu_stats
cpu_mhz
cpu_temp
core_load

# GPU
gpu_stats
gpu_core_clock
gpu_temp
gpu_name

# Memory and storage pressure
ram
swap
procmem
io_read
io_write

# Software stack
dx_api
vulkan_driver
wine
winesync
arch

# Handheld and session status
battery
battery_watt
battery_time
device_battery=gamepad
network=1
time
