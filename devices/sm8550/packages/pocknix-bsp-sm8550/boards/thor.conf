# /usr/lib/pocknix/boards/thor.conf — runtime board facts: AYN Thor.
# Selected by /usr/lib/pocknix/device.conf (DT model "AYN Thor").
#
# Thor is the only dual-screen board on this SoC: a top gaming panel plus a
# second, smaller bottom panel (also touch-capable). Panel/backlight/connector
# facts below come from kernel/sm8550/dts/qcom/qcs8550-ayn-thor.dts and from
# the same board already brought up on the `armada` distro (this fork's sibling
# project) — see armada's system_files/usr/lib/armada/devices/ayn-thor.conf for
# the prior art these values are ported from. UNVERIFIED ON HARDWARE via
# pocknix itself: re-check connector names/orientation on first boot (an
# upside-down or wrong-screen picture means a value below needs flipping).
POCKNIX_DEVICE=thor
POCKNIX_SOC=sm8550

# --- Top (primary/gaming) panel -------------------------------------------
# 1080x1920 portrait native; DTS rotation matches the Odin 2 mounting
# (armada validated ARMADA_PANEL_ORIENTATION=right for this board).
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1920
POCKNIX_PANEL_REFRESH=120        # panel supports 60,120 per armada's tested ARMADA_PANEL_REFRESH_RATES; 120 preferred
POCKNIX_PANEL_ORIENT=right       # gamescope --force-orientation
POCKNIX_PANEL_MM=177x100         # deliberately fake: same ~275dpi handheld UI as the other boards
POCKNIX_DESKTOP_ROTATE=right     # kscreen-doctor rotation token (see ORIENT note)
POCKNIX_DESKTOP_SCALE=2.5        # start at the RP6/Odin2 value; tune on device

# --- Bottom (secondary) panel ----------------------------------------------
# Enabled in-kernel already (mdss_dsi0, status=okay); becomes its own KScreen
# output once the panel is up. On the armada bring-up, enabling the bottom
# panel shifted the TOP panel's connector to DSI-2 (from DSI-1 on the
# single-screen kernel) and the bottom panel came up as DSI-1 - CONFIRM this
# ordering on pocknix's own kernel/session stack; do not assume it is
# identical just because the DTS lineage is shared.
POCKNIX_PRIMARY_CONNECTOR=DSI-2
POCKNIX_PRIMARY_BACKLIGHT=ae96000.dsi.0   # Steam's brightness slider only sees one backlight class device; steer it here (see 90-pocknix-backlight.rules)
POCKNIX_PRIMARY_TOUCHSCREEN=top_touchscreen
POCKNIX_SECONDARY_CONNECTOR=DSI-1
POCKNIX_SECONDARY_ORIENTATION=right
POCKNIX_SECONDARY_TOUCHSCREEN=bottom_touchscreen
POCKNIX_SECONDARY_PANEL_W=1080
POCKNIX_SECONDARY_PANEL_H=1240

# AYN button (top of the device, above the top screen): tap toggles the
# performance HUD between screens, a long press (>=600ms) blanks/unblanks the
# bottom panel outright. linux,code = KEY_F24 (kernel/sm8550/dts/qcom/
# qcs8550-ayn-thor.dts, gpio-keys-ayn). Event device name confirmed on the
# armada bring-up of the same DTS lineage; re-check with `evtest` if the
# listener doesn't see events.
POCKNIX_AYN_BUTTON_DEV=platform-gpio-keys-event
POCKNIX_AYN_BUTTON_KEY=KEY_F24

# CPU topology: big-core mask for emulator pinning (pocknix-play). Same SM8550
# topology as the rest of the family.
POCKNIX_BIG_CORES=3-7

# --- install-to-internal contract (qcom-abl; RP6-verified values, same SoC) ----
POCKNIX_INTERNAL_DISK=/dev/sda
POCKNIX_BOOT_GPT_NAME=ROCKNIX
POCKNIX_BOOT_FAT_LABEL=ROCKNIX
POCKNIX_ROOT_LABEL=POCKNIX_ROOT
