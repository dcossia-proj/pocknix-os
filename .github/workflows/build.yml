# CI: fast checks on every push/PR; the heavy package/kernel/image build is manual
# (workflow_dispatch) until it has had a supervised first run — the full build
# needs an ALARM chroot + loop devices + ~1h of kernel compile, all of which the
# aarch64 ubuntu-24.04-arm hosted runners CAN do, but which is wasteful to run
# blind on every push. Signing/publishing NEVER happens in CI (the GPG key stays
# on the build VM; see pocknix-notes dev/pacman-repo.md).
name: build
on:
  push:
    branches: [main, refactor]
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run the full kernel+packages+image build (aarch64, ~2-3h) and upload a flashable SD image"
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax (bash -n) for every script + PKGBUILD
        run: |
          set -e
          for f in scripts/*.sh; do bash -n "$f"; done
          find packages devices -name PKGBUILD -print0 | xargs -0 -n1 bash -n
          echo "syntax OK"
      - name: shellcheck (informational)
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning scripts/*.sh || true
      - name: Device profile chain resolves
        run: |
          set -e
          for dev in devices/*/; do
            dev="$(basename "$dev")"
            DEVICE="$dev" bash -c 'source scripts/lib.sh
              echo "$DEVICE: SOC=$SOC KERNEL_PKG=$KERNEL_PKG BSP=$DEVICE_BSP_PKG"
              [ -f "$KERNEL_DIR/kernel.conf" ]
              [ -f "$DEVICE_DIR/packages.list" ]'
          done
      - name: kernel-cmdline matches profile (drift guard, same check as build-packages.sh)
        run: |
          set -e
          for f in devices/*/packages/*/kernel-cmdline; do
            devdir="$(dirname "$(dirname "$(dirname "$f")")")"
            want="$(bash -c "unset SOC ROOT_LABEL KERNEL_CMDLINE KERNEL_CMDLINE_ROOT KERNEL_CMDLINE_EXTRA
                             source '$devdir/profile.conf'; printf '%s' \"\$KERNEL_CMDLINE\"")"
            got="$(cat "$f")"
            [ "$want" = "$got" ] || { echo "DRIFT in $f"; exit 1; }
            echo "$f matches $devdir/profile.conf"
          done

  full-build:
    # aarch64 hosted runner: native chroot + makepkg + kernel build, no qemu.
    # Unlike armada (a bootc/OCI image, built via buildah + rechunked + pushed to
    # ghcr, with disk-image assembly as a SEPARATE workflow driven off the
    # published container), pocknix has no intermediate container: it's one
    # sequential pipeline (ALARM chroot -> local pacman repo -> rootfs -> raw disk
    # image), so it's one job here rather than two workflows. First runs will need
    # iteration (chroot bootstrap inside the runner) — treat this job as
    # scaffolding to be hardened on its first supervised run.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Host deps (the build bootstraps its own ALARM chroot)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libarchive-tools curl rsync flex bison bc python3 git \
            build-essential xz-utils dwarves libelf-dev libssl-dev zlib1g-dev \
            parted gdisk dosfstools btrfs-progs zstd
          # dwarves -> pahole (kernel BTF); gdisk -> sgdisk; dosfstools -> mkfs.vfat;
          # btrfs-progs -> mkfs.btrfs/btrfs — the set scripts/*.sh's need_tool calls check for.
          # libelf-dev/libssl-dev/zlib1g-dev aren't need_tool'd (they're headers, not
          # binaries) but CONFIG_DEBUG_INFO_BTF=y pulls in tools/bpf/resolve_btfids,
          # which needs libelf.h to link — first full-build run failed here with
          # "libbpf.c:46:10: fatal error: libelf.h: No such file or directory".
          # libssl-dev/zlib1g-dev are the standard kernel.org-recommended companions
          # (module signing, BTF/module compression) — added preemptively so a second
          # missing-header run doesn't cost another hour of kernel compile to discover.
      - name: Trust the checkout under sudo (root's git has no idea who owns it otherwise)
        run: sudo git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Bootstrap + kernel + packages + rootfs + SD image
        run: |
          sudo make bootstrap
          sudo make kernel
          sudo make packages
          sudo make build
          sudo make sd-image
      - name: Compress + checksum the SD image
        run: |
          set -euxo pipefail
          IMG="build/image/sm8550/pocknix-sm8550-sd.img"
          [ -f "${IMG}" ] || { echo "::error::no ${IMG} — sd-image step didn't produce it"; exit 1; }
          sudo chown "$(id -u):$(id -g)" "${IMG}"
          # Same convention as scripts/publish-image.sh (zstd -12), skipping its
          # rclone-upload half — that needs the maintainer's own bucket credentials,
          # not something a CI run on a fork should attempt.
          zstd -T0 -12 "${IMG}" -o "${IMG}.zst"
          ( cd "$(dirname "${IMG}")" && sha256sum "$(basename "${IMG}.zst")" > "$(basename "${IMG}.zst.sha256")" )
      - name: Upload SD image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocknix-sm8550-sd-image
          path: |
            build/image/sm8550/pocknix-sm8550-sd.img.zst
            build/image/sm8550/pocknix-sm8550-sd.img.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload localrepo as artifact (unsigned — sign locally with make publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localrepo
          path: build/localrepo/
          retention-days: 14
